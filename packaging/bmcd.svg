<?xml version="1.0" encoding="UTF-8"?>
<!-- BMCD icon: blocky download glyph, palette-matched to the app window
     (background 14,20,21 · accent 128,212,215 from DankMatugen.colors). -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect x="16" y="16" width="480" height="480" rx="104" fill="#0E1415"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="103.5" fill="none" stroke="#80D4D7" stroke-opacity="0.22"/>

  <!-- three incoming blocks -->
  <rect x="112" y="104" width="288" height="44" fill="#80D4D7"/>
  <rect x="152" y="180" width="208" height="44" fill="#6FC0C3"/>
  <rect x="192" y="256" width="128" height="44" fill="#5FA9AC"/>

  <!-- arrow head, pointing into the drop zone -->
  <path d="M256 312 L376 416 L136 416 Z" fill="#80D4D7"/>

  <!-- ground line -->
  <rect x="112" y="440" width="288" height="18" fill="#80D4D7" fill-opacity="0.35"/>
</svg>
